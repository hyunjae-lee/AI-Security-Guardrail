<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="Inter, 'Noto Sans KR', sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#5fe0bd" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#7fd8f0" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f5f5f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e9eef2"/>
      <stop offset="1" stop-color="#c9d3db"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8c4ce"/>
      <stop offset="1" stop-color="#dfe6ec"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff8f0" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#8fe3cb" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3cc29c" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b98e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#14b98e" stop-opacity=".95"/>
      <stop offset="1" stop-color="#14b98e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc56b"/><stop offset="1" stop-color="#ef9a1f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd4ad"/><stop offset="1" stop-color="#0d9a78"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be06f"/><stop offset="1" stop-color="#4f9e2c"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8b7d"/><stop offset="1" stop-color="#d7392c"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="trailL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef9a1f" stop-opacity="0"/><stop offset="1" stop-color="#ef9a1f" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="trailR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b98e" stop-opacity=".55"/><stop offset="1" stop-color="#14b98e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 빛 -->
  <ellipse cx="300" cy="225" rx="250" ry="200" fill="url(#glow)"/>
  <!-- 바닥 그림자 -->
  <ellipse cx="300" cy="418" rx="150" ry="16" fill="#000" opacity=".12" filter="url(#soft2)"/>

  <!-- 흐름 궤적 -->
  <rect x="20" y="168" width="160" height="3" rx="1.5" fill="url(#trailL)"/>
  <rect x="20" y="248" width="150" height="3" rx="1.5" fill="url(#trailL)"/>
  <rect x="20" y="328" width="160" height="3" rx="1.5" fill="url(#trailL)"/>
  <rect x="380" y="168" width="200" height="3" rx="1.5" fill="url(#trailR)"/>
  <rect x="380" y="328" width="200" height="3" rx="1.5" fill="url(#trailR)"/>

  <!-- 들어오는 질문 (흐릿 → 선명) -->
  <g opacity=".3"><rect x="10" y="150" width="62" height="38" rx="12" fill="url(#amber)"/></g>
  <g opacity=".3"><rect x="10" y="310" width="62" height="38" rx="12" fill="url(#amber)"/></g>

  <!-- 게이트 두께 -->
  <path d="M246 404 V146 A68 68 0 0 1 382 146 V404 h-22 V148 A46 46 0 0 0 268 148 V404 z" fill="url(#side)"/>
  <!-- 유리 -->
  <path d="M252 410 V152 A48 48 0 0 1 348 152 V410 z" fill="url(#glass)"/>
  <path d="M262 400 V156 A38 38 0 0 1 282 122" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".55"/>
  <!-- 게이트 프레임 -->
  <path d="M230 410 V150 A70 70 0 0 1 370 150 V410 h-22 V152 A48 48 0 0 0 252 152 V410 z" fill="url(#frame)" stroke="#c3ccd4" stroke-width="1"/>
  <!-- 스캔 빛 -->
  <rect x="252" y="236" width="96" height="10" fill="url(#beam)" filter="url(#soft2)"/>
  <rect x="252" y="240" width="96" height="2" fill="#e9fff8"/>
  <!-- 방패 배지 -->
  <circle cx="300" cy="80" r="24" fill="#fff" stroke="#d8dfe5"/>
  <path d="M300 68 l13 5 v9 c0 9 -5.6 14.4 -13 17.6 c-7.4 -3.2 -13 -8.6 -13 -17.6 v-9 z" fill="url(#teal)"/>
  <path d="M294 83 l4.4 4.4 l8 -8.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ① 가려져 통과: 주민번호 -->
  <g>
    <rect x="98" y="146" width="112" height="46" rx="15" fill="url(#amber)"/>
    <text x="112" y="166" font-size="11" font-weight="600" fill="#fff">장학생 명단</text>
    <text x="112" y="181" font-size="10" fill="#fff" opacity=".9">900101-1234567</text>
  </g>
  <g>
    <rect x="394" y="146" width="124" height="46" rx="15" fill="url(#teal)"/>
    <text x="408" y="166" font-size="11" font-weight="600" fill="#fff">장학생 명단</text>
    <text x="408" y="181" font-size="10" fill="#fff" opacity=".95">900101-•••••••</text>
    <circle cx="518" cy="146" r="11" fill="#fff"/><rect x="512" y="144.5" width="12" height="3" rx="1.5" fill="#0d9a78"/>
  </g>

  <!-- ② 차단: 미공개 연구노트 -->
  <g>
    <rect x="90" y="226" width="124" height="46" rx="15" fill="url(#red)"/>
    <text x="104" y="246" font-size="11" font-weight="600" fill="#fff">미공개 연구노트</text>
    <text x="104" y="261" font-size="10" fill="#fff" opacity=".9">반출 금지 등급</text>
    <circle cx="214" cy="226" r="11" fill="#fff"/>
    <path d="M209.5 221.5 l9 9 M218.5 221.5 l-9 9" stroke="#d7392c" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- ③ 그대로 통과 -->
  <g>
    <rect x="98" y="306" width="112" height="46" rx="15" fill="url(#amber)"/>
    <text x="112" y="326" font-size="11" font-weight="600" fill="#fff">학칙 질문</text>
    <text x="112" y="341" font-size="10" fill="#fff" opacity=".9">공개 정보</text>
  </g>
  <g>
    <rect x="394" y="306" width="112" height="46" rx="15" fill="url(#green)"/>
    <text x="408" y="326" font-size="11" font-weight="600" fill="#fff">학칙 질문</text>
    <text x="408" y="341" font-size="10" fill="#fff" opacity=".95">공개 정보</text>
    <circle cx="506" cy="306" r="11" fill="#fff"/>
    <path d="M500.5 306 l3.8 3.8 l6.6 -7" fill="none" stroke="#4f9e2c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
